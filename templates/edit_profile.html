{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile - Connectly</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<header class="navbar">

    <div class="logo">
        Connectly
    </div>

    <nav>
        <a href="{% url 'home' %}">Home</a>

        <a href="{% url 'profile' user.username %}">
            Profile
        </a>

        <a href="{% url 'logout' %}">
            Logout
        </a>
    </nav>

</header>


<main class="auth-container">

    <div class="auth-card">

        <h1>Edit Profile ✨</h1>

        <p>Update your Connectly profile.</p>


        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <label>Bio</label>

            <textarea
                name="bio"
                placeholder="Tell people something about you..."
                maxlength="500"
            >{{ profile.bio }}</textarea>


            <label>Profile Image URL</label>

            <input
                type="url"
                name="avatar"
                value="{{ profile.avatar }}"
                placeholder="https://example.com/photo.jpg"
            >


            <button type="submit">
                Save Changes
            </button>

        </form>


        <p class="auth-link">

            <a href="{% url 'profile' user.username %}">
                ← Back to Profile
            </a>

        </p>

    </div>

</main>


<script src="{% static 'js/script.js' %}"></script>

</body>
</html>
